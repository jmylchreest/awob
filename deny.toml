# cargo-deny configuration for awob
#
# Goals:
#   - Keep awob's dependency closure license-compatible (MIT codebase).
#   - Surface RustSec advisories as actionable warnings that surface in `cargo deny check advisories`.
#   - Tolerate "OR-licensing" expressions (e.g. "MIT OR Apache-2.0") that
#     deny otherwise can't resolve via SPDX alone.
#
# Workflow:
#   cargo deny check                  # all checks
#   cargo deny check licenses         # just licence
#   cargo deny check advisories       # just advisories
#
# When bumping dep versions, re-run and look for new "unlicensed" entries.

[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "warn"

[licenses]
# Permissive + weak-copyleft are fine for awob (MIT). Strong-copyleft
# (GPL-2.0-or-later, GPL-3.0, AGPL-*) is intentionally excluded —
# list an exception below if awob ever needs one.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDDL-1.0",
  "EPL-1.0",
  "EPL-2.0",
  "FTL",
  "ISC",
  "LGPL-2.0-only",
  "LGPL-2.0-or-later",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "MPL-1.1",
  "MPL-2.0",
  "MIT",
  "MIT-0",
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
exceptions = []
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
