name: Weekly security audit
run-name: ${{ inputs.fallback_of && format('fallback:{0}', inputs.fallback_of) || github.workflow }}

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      backend:
        description: Runner backend
        type: choice
        options: [hosted, arc]
        default: hosted
      source_sha:
        description: Exact source commit supplied by the fallback router
        type: string
      fallback_of:
        description: Parent run ID supplied by the fallback router
        type: string

permissions: {}

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    permissions:
      contents: read
    if: ${{ !inputs.source_sha || inputs.source_sha == github.workflow_sha }}
    runs-on: ${{ github.event_name != 'pull_request' && inputs.backend == 'arc' && 'awob-linux' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: command -v cargo-audit >/dev/null || cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
