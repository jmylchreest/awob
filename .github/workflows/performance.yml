name: Renderer benchmarks

on:
  pull_request:
    paths:
      - 'crates/awob-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/performance.yml'
  push:
    branches: [main]
    paths:
      - 'crates/awob-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/performance.yml'
  workflow_dispatch:

permissions: {}
concurrency:
  group: renderer-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: renderer-benchmarks
      - name: Measure rendering and allocations
        run: cargo bench -p awob-core --bench render --locked -- --sample-count 100 --sample-size 10 > renderer-benchmarks.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: renderer-benchmarks
          path: renderer-benchmarks.txt
          if-no-files-found: error
