# awob CI: build + test + lint on every PR and push to main.
#
# Linux-only by design — awob is a Wayland-only project. The runner
# needs system libs that the workspace links against (PipeWire,
# libudev, fontconfig). Each job installs them up front; cache
# restores Cargo registry + target dir between runs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

# Cancel any in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Build steps don't gate on warnings — only the dedicated clippy
  # step does. Letting the build itself escalate warnings to errors
  # forces every dependency-driven nit (rust-version drift, deprecation
  # heads-up) to break CI, which is too strict for a pre-1.0 project.

jobs:
  test:
    name: cargo test (stable)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libpipewire-0.3-dev libdbus-1-dev \
            libudev-dev libxkbcommon-dev

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  clippy:
    name: cargo clippy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libpipewire-0.3-dev libdbus-1-dev \
            libudev-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci

      # Workspace is clippy-clean — gate on warnings.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    name: cargo fmt --check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    name: cargo build (MSRV)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libpipewire-0.3-dev libdbus-1-dev \
            libudev-dev libxkbcommon-dev

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: msrv

      - run: cargo build --workspace --locked

  deny:
    name: cargo deny
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --locked
